name: 每日低空经济情报采集

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - collect
          - test

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download zh_core_web_sm

      - name: 创建必要目录
        run: |
          mkdir -p raw/feeds raw/gov raw/associations
          mkdir -p processed reports logs

      - name: 运行情报采集流水线
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "运行模式: $MODE"
          python scripts/main.py --mode "$MODE"

      - name: 生成采集摘要
        if: always()
        run: |
          echo "## 采集摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f processed/pipeline_summary.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat processed/pipeline_summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "无摘要数据" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 提交采集结果
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/ processed/ reports/ logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无新数据需要提交"
          else
            git commit -m "chore: 每日情报采集 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 发送通知
        if: always() && env.NOTIFICATION_WEBHOOK != ''
        env:
          NOTIFICATION_WEBHOOK: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          STATUS="${{ job.status }}"
          curl -X POST "$NOTIFICATION_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"低空经济情报采集任务完成\n状态: $STATUS\n时间: $(date -u '+%Y-%m-%d %H:%M') UTC\"}" || true
