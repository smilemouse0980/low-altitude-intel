name: 每周情报报告生成

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成周报数据 + Phase 2 深度分析 + Markdown 报告
        run: |
          mkdir -p reports processed
          python -c "
          import sys, json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          sys.path.insert(0, 'scripts')
          BJT = timezone(timedelta(hours=8))
          today = datetime.now(BJT).strftime('%Y-%m-%d')

          # 1. 生成周报 JSON 数据
          from report_generator import ReportGenerator
          gen = ReportGenerator()
          gen.generate_weekly(today)
          print(f'周报数据已生成: {today}')

          # 2. Phase 2 深度分析
          try:
              from company_profiler import CompanyProfiler
              profiler = CompanyProfiler()
              profiles = profiler.build_all_profiles()
              print(f'企业画像: {len(profiles)} 家')
          except Exception as e:
              print(f'企业画像失败: {e}')

          try:
              from knowledge_graph import KnowledgeGraphBuilder
              kg = KnowledgeGraphBuilder()
              summary = kg.build()
              print(f'知识图谱: {summary[\"total_nodes\"]} 节点, {summary[\"total_edges\"]} 边')
          except Exception as e:
              print(f'知识图谱失败: {e}')

          try:
              from competitive_analysis import CompetitiveAnalyzer
              analyzer = CompetitiveAnalyzer()
              analyzer.analyze()
              print('竞争格局分析完成')
          except Exception as e:
              print(f'竞争分析失败: {e}')

          try:
              from enhanced_reporter import EnhancedReporter
              reporter = EnhancedReporter()
              reporter.generate_all()
              print('增强报告生成完成')
          except Exception as e:
              print(f'增强报告失败: {e}')

          try:
              from ima_exporter import IMAExporter
              exporter = IMAExporter()
              exporter.export_all()
              print('IMA 导出完成')
          except Exception as e:
              print(f'IMA 导出失败: {e}')
          "

      - name: 提交周报
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "report: 周报 $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "无新报告需要提交"
          fi
