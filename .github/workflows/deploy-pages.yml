name: 部署报告站点到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'reports/**'
      - 'processed/pipeline_summary.json'
      - 'processed/knowledge_graph/kg_summary.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备站点文件
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          # 复制报告文件到站点
          cp -r reports _site/reports
          # 复制摘要数据
          mkdir -p _site/processed/knowledge_graph
          cp processed/pipeline_summary.json _site/processed/ 2>/dev/null || echo '{}' > _site/processed/pipeline_summary.json
          cp processed/knowledge_graph/kg_summary.json _site/processed/knowledge_graph/ 2>/dev/null || echo '{}' > _site/processed/knowledge_graph/kg_summary.json
          # 添加 .nojekyll 防止 GitHub Pages 忽略下划线开头的文件
          touch _site/.nojekyll

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
