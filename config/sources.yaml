# 采集配置
collection:
  request_interval: 30  # 请求间隔（秒）
  max_retries: 3        # 最大重试次数
  retry_interval: 30    # 重试间隔（秒）
  timeout: 30           # 请求超时（秒）
  respect_robots_txt: true
  user_agent: "Mozilla/5.0 (compatible; LowAltitudeIntelBot/1.0)"
  encoding: "utf-8"
  output_format: "json"
  save_raw_html: false  # 是否保存原始HTML

# NER 配置
ner:
  engines:
    - "hanlp"
    - "spacy"
  confidence_threshold: "intersection"  # intersection=取交集(高置信), union=取并集(全量)
  custom_dict_path: "config/industry_dict.yaml"
  
# 元数据字段定义
metadata_fields:
  document:
    - title
    - publisher
    - publish_date
    - source_url
    - source_site
    - content
  entity:
    - person_names
    - org_names
    - titles
    - speech_topics
  meeting:
    - meeting_name
    - meeting_date
    - meeting_location
    - meeting_organizer
